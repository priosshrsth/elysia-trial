<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elysia React App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }

        /* SVG Text Animation */
        .text-container {
            width: 100%;
            height: auto;
            min-height: 150px;
            display: flex;
            justify-content: center;
        }

        svg text {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            text-anchor: middle;
            font-size: 80px;
            stroke-width: 2px;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: drawStroke 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .text-bun { 
            stroke: #fbbf24; 
            fill: transparent;
            animation: drawStroke 3s forwards, fillBun 1s ease-out 2.5s forwards;
        }
        .text-plus { 
            stroke: #fff; 
            fill: transparent;
            font-weight: 300;
            animation: drawStroke 3s forwards, fillWhite 1s ease-out 2.8s forwards;
        }
        .text-elysia { 
            stroke: #818cf8; 
            fill: transparent;
            animation: drawStroke 3s forwards, fillElysia 1s ease-out 3s forwards;
        }
        .text-equals { 
            stroke: #fff; 
            font-weight: 300;
            fill: transparent;
            animation: drawStroke 3s forwards, fillWhite 1s ease-out 3.2s forwards;
        }

        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fillBun {
            to { fill: url(#gradientBunYellow); stroke: transparent; }
        }
        @keyframes fillElysia {
            to { fill: url(#gradientElysia); stroke: transparent; }
        }
        @keyframes fillWhite {
            to { fill: #fff; stroke: transparent; }
        }

        /* Image & Result Container */
        .result-container {
            position: relative;
            margin-top: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            animation: revealImage 1s cubic-bezier(0.34, 1.56, 0.64, 1) 3.5s forwards;
            position: relative;
        }

        .image-card img {
            display: block;
            border-radius: 30px;
            max-width: 100%;
            width: 350px;
            height: auto;
        }

        .glowing-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(40px);
            animation: pulseOrb 4s ease-in-out infinite alternate;
        }

        @keyframes revealImage {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseOrb {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Fire Emoji Animation */
        .fire-badge {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 4rem;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
            animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 4s backwards,
                       fireWiggle 2s ease-in-out infinite 4.5s;
            z-index: 20;
        }

        @keyframes badgePop {
            from { transform: scale(0) rotate(-180deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes fireWiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            svg text { font-size: 40px; }
            .image-card img { width: 250px; }
            .fire-badge { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <svg width="100%" height="120" viewBox="0 0 1000 120">
                <defs>
                     <linearGradient id="gradientBunYellow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#fbbf24" />
                        <stop offset="100%" stop-color="#f59e0b" />
                    </linearGradient>
                    <linearGradient id="gradientElysia" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#818cf8" />
                        <stop offset="100%" stop-color="#c084fc" />
                    </linearGradient>
                </defs>
                
                <text x="50%" y="80">
                    <tspan class="text-bun" style="fill: url(#gradientBunYellow)">Bun</tspan>
                    <tspan class="text-plus" dx="20">+</tspan>
                    <tspan class="text-elysia" dx="20" style="fill: url(#gradientElysia)">Elysia JS</tspan>
                    <tspan class="text-equals" dx="20">=</tspan>
                </text>
            </svg>
        </div>

        <div class="result-container">
            <div class="glowing-orb"></div>
            <div class="image-card">
                <img src="./elysia+bun.png" alt="Bun + Elysia Result" />
                <div class="fire-badge">🔥</div>
            </div>
        </div>
    </div>
</body>
</html>
