[tools]
bun = "latest"
node = "24"

# ---------- Housekeeping ----------

[tasks.cleanup]
description = "Cleanup node_modules, build outputs and lockfiles"
run = """
bash -eo pipefail -c '
  find . -type d -name node_modules -prune -exec rm -rf {} +
  find . -type d -name dist -prune -exec rm -rf {} +
  find . -type d -name .next -prune -exec rm -rf {} +
'
"""

# ---------- Database ----------

[tasks."gen:migration"]
description = "Generate migration files"
dir = "apps/api"
run = "bun run migration:generate --name"

[tasks."run:migration"]
description = "Run migration files"
dir = "apps/api"
run = "bun run migration:run"

# ---------- Remote Database ----------

[tasks."ssh:db"]
description = "SSH into DB VM via IAP tunnel"
run = """
gcloud compute ssh servio-db \
  --zone ${GCP_REGION:-us-central1}-c \
  --tunnel-through-iap \
  --project ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}
"""

[tasks."db:tunnel"]
description = "Port-forward local 5433 to remote DB (usage: connect to localhost:5433)"
run = """
echo "Tunnel open: postgresql://postgres:<password>@localhost:5433/servio_<env>"
echo "Press Ctrl+C to close"
gcloud compute ssh servio-db \
  --zone ${GCP_REGION:-us-central1}-c \
  --tunnel-through-iap \
  --project ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID} \
  -- -N -L 5433:localhost:5432
"""

[tasks."db:migrate:remote"]
description = "Run migrations against remote DB (usage: mise run db:migrate:remote -- <prod|staging>)"
dir = "apps/api"
run = """
bash -eo pipefail -c '
  ENV="{{arg(name="env")}}"
  if [ "$ENV" != "prod" ] && [ "$ENV" != "staging" ]; then
    echo "Usage: mise run db:migrate:remote -- <prod|staging>"
    exit 1
  fi
  DB_NAME="servio_${ENV}"
  PROJECT=${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}
  ZONE="${GCP_REGION:-us-central1}-c"

  echo "Starting IAP tunnel to ${DB_NAME}..."
  gcloud compute ssh servio-db --zone $ZONE --tunnel-through-iap --project $PROJECT -- -N -L 5433:localhost:5432 &
  TUNNEL_PID=$!
  sleep 3

  echo "Running migrations on ${DB_NAME}..."
  DB_URL="postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD}@localhost:5433/${DB_NAME}" bun run migration:run
  EXIT_CODE=$?

  kill $TUNNEL_PID 2>/dev/null || true
  exit $EXIT_CODE
'
"""

# ---------- Infrastructure ----------

[tasks."infra:init"]
description = "Bootstrap GCS bucket, enable APIs, and init Terraform"
run = "bun run cicd/scripts/init.ts"

[tasks."infra:plan"]
description = "Terraform plan for a layer (usage: mise run infra:plan -- <platform|api|web>)"
run = "bun run cicd/scripts/infra.ts plan {{arg(name=\"layer\")}}"

[tasks."infra:deploy"]
description = "Terraform apply for a layer (usage: mise run infra:deploy -- <platform|api|web>)"
run = "bun run cicd/scripts/infra.ts apply {{arg(name=\"layer\")}}"

[tasks."infra:destroy"]
description = "Terraform destroy for a layer (usage: mise run infra:destroy -- <platform|api|web>)"
run = "bun run cicd/scripts/infra.ts destroy {{arg(name=\"layer\")}}"

[tasks."infra:all"]
description = "Deploy all layers in order: platform -> api -> web"
depends = ["infra:deploy -- platform", "infra:deploy -- api", "infra:deploy -- web"]

# ---------- Deploy ----------

[tasks."deploy:api"]
description = "Build and deploy API to Cloud Run (usage: mise run deploy:api -- <prod|staging|preview> [previewId])"
run = "bun run cicd/scripts/build-and-deploy.ts api {{arg(name=\"env\")}} {{arg(name=\"previewId\", default=\"\")}}"

[tasks."deploy:web"]
description = "Build and deploy Web to Cloud Run (usage: mise run deploy:web -- <prod|staging|preview> [previewId])"
run = "bun run cicd/scripts/build-and-deploy.ts web {{arg(name=\"env\")}} {{arg(name=\"previewId\", default=\"\")}}"

[tasks."deploy:all"]
description = "Deploy both API and Web to prod"
run = """
bun run cicd/scripts/build-and-deploy.ts api prod
bun run cicd/scripts/build-and-deploy.ts web prod
"""

# ---------- Preview ----------

[tasks."preview:create"]
description = "Create a preview environment (usage: mise run preview:create -- <previewId>)"
run = "bun run cicd/scripts/preview.ts create {{arg(name=\"previewId\")}}"

[tasks."preview:destroy"]
description = "Destroy a preview environment (usage: mise run preview:destroy -- <previewId>)"
run = "bun run cicd/scripts/preview.ts destroy {{arg(name=\"previewId\")}}"
