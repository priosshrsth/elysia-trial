[tools]
bun = "latest"
node = "24"

# ---------- Housekeeping ----------

[tasks.cleanup]
description = "Cleanup node_modules, build outputs and lockfiles"
run = """
bash -eo pipefail -c '
  find . -type d -name node_modules -prune -exec rm -rf {} +
  find . -type d -name dist -prune -exec rm -rf {} +
  find . -type d -name .next -prune -exec rm -rf {} +
'
"""

# ---------- Database ----------

[tasks."gen:migration"]
description = "Generate migration files"
dir = "apps/api"
run = "bun run migration:generate --name"

[tasks."run:migration"]
description = "Run migration files"
dir = "apps/api"
run = "bun run migration:run"

# ---------- Remote Database ----------

[tasks."ssh:db"]
description = "SSH into DB VM via IAP tunnel"
run = """
gcloud compute ssh servio-db \
  --zone ${GCP_REGION:-us-central1}-c \
  --tunnel-through-iap \
  --project ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}
"""

[tasks."db:tunnel"]
description = "Port-forward local 5433 to remote DB (usage: connect to localhost:5433)"
run = """
echo "Tunnel open: postgresql://postgres:<password>@localhost:5433/servio_<env>"
echo "Press Ctrl+C to close"
gcloud compute ssh servio-db \
  --zone ${GCP_REGION:-us-central1}-c \
  --tunnel-through-iap \
  --project ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID} \
  -- -N -L 5433:localhost:5432
"""

[tasks."db:migrate:remote"]
description = "Run migrations against remote DB (usage: mise run db:migrate:remote -- <staging|production>)"
dir = "apps/api"
run = """
bash -eo pipefail -c '
  ENV="{{arg(name="env")}}"
  if [ "$ENV" != "staging" ] && [ "$ENV" != "production" ]; then
    echo "Usage: mise run db:migrate:remote -- <staging|production>"
    exit 1
  fi
  DB_NAME="servio_${ENV}"
  PROJECT=${GCP_PROJECT_ID:?Set GCP_PROJECT_ID}
  ZONE="${GCP_REGION:-us-central1}-c"

  echo "Starting IAP tunnel to ${DB_NAME}..."
  gcloud compute ssh servio-db --zone $ZONE --tunnel-through-iap --project $PROJECT -- -N -L 5433:localhost:5432 &
  TUNNEL_PID=$!
  sleep 3

  echo "Running migrations on ${DB_NAME}..."
  DB_URL="postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD}@localhost:5433/${DB_NAME}" bun run migration:run
  EXIT_CODE=$?

  kill $TUNNEL_PID 2>/dev/null || true
  exit $EXIT_CODE
'
"""

# ---------- Infrastructure ----------

[tasks."infra:init"]
description = "Bootstrap GCS bucket, enable APIs, and init Terraform (usage: mise run infra:init -- <staging|production>)"
run = "bun run cicd/scripts/init.ts {{arg(name=\"env\")}}"

[tasks."infra:plan"]
description = "Terraform plan for a layer (usage: mise run infra:plan -- <platform|api> <staging|production>)"
run = "bun run cicd/scripts/infra.ts plan {{arg(name=\"layer\")}} {{arg(name=\"env\")}}"

[tasks."infra:deploy"]
description = "Terraform apply for a layer (usage: mise run infra:deploy -- <platform|api> <staging|production>)"
run = "bun run cicd/scripts/infra.ts apply {{arg(name=\"layer\")}} {{arg(name=\"env\")}}"

[tasks."infra:destroy"]
description = "Terraform destroy for a layer (usage: mise run infra:destroy -- <platform|api> <staging|production>)"
run = "bun run cicd/scripts/infra.ts destroy {{arg(name=\"layer\")}} {{arg(name=\"env\")}}"

# ---------- Deploy ----------

[tasks.deploy]
description = "Full deploy: platform infra + API infra + populate DB/Redis secrets + build & push image + Cloud Run deploy (usage: mise run deploy -- <staging|production>)"
run = "bun run cicd/scripts/deploy.ts {{arg(name=\"env\")}}"

[tasks."deploy:api"]
description = "Build and deploy API to Cloud Run only (usage: mise run deploy:api -- <staging|production>)"
run = "bun run cicd/scripts/build-and-deploy.ts {{arg(name=\"env\")}}"
