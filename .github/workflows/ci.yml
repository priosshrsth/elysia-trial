name: CI

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: elysia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Run tests
        env:
          DB_URL: postgresql://postgres:admin@localhost:5432/elysia_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3001
          AUTH_SECRET: test-secret-key-for-ci-only
          COOKIE_KEY: test
          TRUSTED_DOMAINS: http://localhost:3000,http://localhost:3001
          BETTER_AUTH_BASE_URL: http://localhost:3001
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ""
          SMTP_PASS: ""
          EMAIL_FROM: noreply@elysia.dev
        run: bun run tests
