name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  AR_REPO: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/servio

jobs:
  build-deploy-api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REPO }}/api:prod-latest
            ${{ env.AR_REPO }}/api:prod-${{ github.sha }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy api-prod \
            --image ${{ env.AR_REPO }}/api:prod-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,PORT=3001,EMAIL_FROM=noreply@servio.dev" \
            --update-secrets "DB_URL=api-prod-DB_URL:latest,REDIS_URL=api-prod-REDIS_URL:latest,AUTH_SECRET=api-prod-AUTH_SECRET:latest,COOKIE_KEY=api-prod-COOKIE_KEY:latest,SMTP_HOST=api-prod-SMTP_HOST:latest,SMTP_PORT=api-prod-SMTP_PORT:latest,SMTP_USER=api-prod-SMTP_USER:latest,SMTP_PASS=api-prod-SMTP_PASS:latest" \
            --port 3001 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 2 \
            --vpc-connector servio-vpc-cx \
            --vpc-egress private-ranges-only

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe api-prod --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  build-deploy-web:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REPO }}/web:prod-latest
            ${{ env.AR_REPO }}/web:prod-${{ github.sha }}
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy web-prod \
            --image ${{ env.AR_REPO }}/web:prod-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --port 3000 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 1

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe web-prod --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  configure:
    needs: [build-deploy-api, build-deploy-web]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Update API with service URLs
        run: |
          gcloud run services update api-prod \
            --region ${{ env.REGION }} \
            --update-env-vars "BETTER_AUTH_BASE_URL=${{ needs.build-deploy-api.outputs.url }},TRUSTED_DOMAINS=${{ needs.build-deploy-web.outputs.url }}"
