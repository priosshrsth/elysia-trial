name: Deploy

on:
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event.release.prerelease && 'staging' || 'production' }}
  cancel-in-progress: ${{ github.event.release.prerelease }}

permissions:
  contents: read
  id-token: write

env:
  ENV: ${{ github.event.release.prerelease && 'staging' || 'production' }}
  TAG: ${{ github.event.release.tag_name }}
  GCP_PROJECT_ID: ${{ github.event.release.prerelease && vars.GCP_PROJECT_ID_STAGING || vars.GCP_PROJECT_ID_PRODUCTION }}
  WIF_PROVIDER: ${{ github.event.release.prerelease && vars.WIF_PROVIDER_STAGING || vars.WIF_PROVIDER_PRODUCTION }}
  GCP_SA_EMAIL: ${{ github.event.release.prerelease && vars.GCP_SA_EMAIL_STAGING || vars.GCP_SA_EMAIL_PRODUCTION }}
  AR_REGISTRY_URL: ${{ github.event.release.prerelease && vars.AR_REGISTRY_URL_STAGING || vars.AR_REGISTRY_URL_PRODUCTION }}

jobs:
  build-deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker $(echo "${{ env.AR_REGISTRY_URL }}" | cut -d'/' -f1) --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REGISTRY_URL }}/api:${{ env.ENV }}-latest
            ${{ env.AR_REGISTRY_URL }}/api:${{ env.TAG }}
          cache-from: type=gha,scope=api-${{ env.ENV }}
          cache-to: type=gha,mode=max,scope=api-${{ env.ENV }}

      - uses: oven-sh/setup-bun@v2

      - name: Deploy to Cloud Run
        run: bun cicd/apps/api/deploy.ts ${{ env.ENV }} ${{ env.AR_REGISTRY_URL }}/api:${{ env.TAG }}
