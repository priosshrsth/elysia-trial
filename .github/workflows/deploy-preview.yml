name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
      preview_id:
        description: "Preview ID (e.g., PR number or short name)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  AR_REPO: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/elysia

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # Create preview database
      - name: Create preview database
        run: |
          gcloud compute ssh elysia-db \
            --zone ${{ env.REGION }}-c \
            --tunnel-through-iap \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --command "docker exec postgres psql -U postgres -c 'CREATE DATABASE elysia_preview_${{ inputs.preview_id }};'" || true

      # Construct preview DB_URL from staging secret (same host/credentials, different database name)
      - name: Construct preview DB_URL
        id: db-url
        run: |
          STAGING_DB_URL=$(gcloud secrets versions access latest --secret=api-staging-DB_URL --project=${{ vars.GCP_PROJECT_ID }})
          PREVIEW_DB_URL=$(echo "$STAGING_DB_URL" | sed "s|/[^/?]*\([?]\)|/elysia_preview_${{ inputs.preview_id }}\1|;t;s|/[^/]*$|/elysia_preview_${{ inputs.preview_id }}|")
          echo "::add-mask::$PREVIEW_DB_URL"
          echo "url=$PREVIEW_DB_URL" >> $GITHUB_OUTPUT

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.AR_REPO }}/api:preview-${{ inputs.preview_id }}
          cache-from: type=gha,scope=api-preview
          cache-to: type=gha,mode=max,scope=api-preview

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.AR_REPO }}/web:preview-${{ inputs.preview_id }}
          cache-from: type=gha,scope=web-preview
          cache-to: type=gha,mode=max,scope=web-preview

      - name: Deploy API preview
        run: |
          gcloud run deploy api-preview-${{ inputs.preview_id }} \
            --image ${{ env.AR_REPO }}/api:preview-${{ inputs.preview_id }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=staging,PORT=3001,EMAIL_FROM=noreply@elysia.dev,DB_URL=${{ steps.db-url.outputs.url }}" \
            --update-secrets "REDIS_URL=api-staging-REDIS_URL:latest,AUTH_SECRET=api-staging-AUTH_SECRET:latest,COOKIE_KEY=api-staging-COOKIE_KEY:latest,SMTP_HOST=api-staging-SMTP_HOST:latest,SMTP_PORT=api-staging-SMTP_PORT:latest,SMTP_USER=api-staging-SMTP_USER:latest,SMTP_PASS=api-staging-SMTP_PASS:latest" \
            --port 3001 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 1 \
            --vpc-connector elysia-vpc-cx \
            --vpc-egress private-ranges-only

      - name: Get API URL
        id: api-url
        run: |
          URL=$(gcloud run services describe api-preview-${{ inputs.preview_id }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Web preview
        run: |
          gcloud run deploy web-preview-${{ inputs.preview_id }} \
            --image ${{ env.AR_REPO }}/web:preview-${{ inputs.preview_id }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=staging,NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.url }}" \
            --port 3000 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 1

      - name: Get Web URL
        id: web-url
        run: |
          URL=$(gcloud run services describe web-preview-${{ inputs.preview_id }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      # Update API with auth URLs now that both services are deployed
      - name: Update API with auth env vars
        run: |
          gcloud run services update api-preview-${{ inputs.preview_id }} \
            --region ${{ env.REGION }} \
            --update-env-vars "BETTER_AUTH_BASE_URL=${{ steps.api-url.outputs.url }},TRUSTED_DOMAINS=${{ steps.web-url.outputs.url }}"

      - name: Output preview URLs
        run: |
          echo "## Preview Environment: ${{ inputs.preview_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.api-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** ${{ steps.web-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
