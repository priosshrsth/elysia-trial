name: Destroy Preview

on:
  workflow_dispatch:
    inputs:
      preview_id:
        description: "Preview ID to destroy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run services
        run: |
          gcloud run services delete api-preview-${{ inputs.preview_id }} \
            --region ${{ env.REGION }} --quiet || true
          gcloud run services delete web-preview-${{ inputs.preview_id }} \
            --region ${{ env.REGION }} --quiet || true

      - name: Drop preview database
        run: |
          gcloud compute ssh elysia-db \
            --zone ${{ env.REGION }}-c \
            --tunnel-through-iap \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --command "docker exec postgres psql -U postgres -c 'DROP DATABASE IF EXISTS elysia_preview_${{ inputs.preview_id }};'"

      - name: Cleanup images
        run: |
          gcloud artifacts docker images delete \
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/elysia/api:preview-${{ inputs.preview_id }} --quiet || true
          gcloud artifacts docker images delete \
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/elysia/web:preview-${{ inputs.preview_id }} --quiet || true
